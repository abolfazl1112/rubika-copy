<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mashal tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#5e6ad2;
    --primary-hover:#828fff;
    --primary-focus:#5e69d1;
    --on-primary:#ffffff;
    --ink:#f7f8f8;
    --ink-muted:#d0d6e0;
    --ink-subtle:#8a8f98;
    --ink-tertiary:#62666d;
    --canvas:#010102;
    --surface-1:#0f1011;
    --surface-2:#141516;
    --surface-3:#18191a;
    --surface-4:#191a1b;
    --hairline:#23252a;
    --hairline-strong:#34343a;
    --hairline-tertiary:#3e3e44;
    --success:#27a644;
    --danger:#e5484d;
    --r-xs:4px;
    --r-sm:6px;
    --r-md:8px;
    --r-lg:12px;
    --r-xl:16px;
    --r-xxl:24px;
    --r-full:9999px;
    --ease-smooth:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', Roboto, 'Vazirmatn', sans-serif;
    color:var(--ink);
    background:var(--canvas);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .app{
    position:relative;
    width:100%;
    max-width:1280px;
    height:100vh;
    max-height:860px;
    display:flex;
    background:var(--canvas);
    border:1px solid var(--hairline);
    border-radius:var(--r-lg);
    overflow:hidden;
  }

  /* ================================================
     RIPPLE — the ONLY touch feedback on the page
     ================================================ */
  .ripple-host{
    position:relative;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .ripple{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    transform:scale(0);
    background:radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,.08) 60%, transparent 100%);
    animation:rippleEffect .62s cubic-bezier(.32,.72,0,1) forwards;
    will-change:transform, opacity;
  }
  .ripple.on-primary{
    background:radial-gradient(circle, rgba(255,255,255,.45) 0%, rgba(255,255,255,.15) 60%, transparent 100%);
  }
  .ripple.on-danger{
    background:radial-gradient(circle, rgba(255,255,255,.35) 0%, rgba(255,255,255,.1) 60%, transparent 100%);
  }
  @keyframes rippleEffect{
    to { transform:scale(2.4); opacity:0; }
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:380px;
    min-width:380px;
    background:var(--canvas);
    border-inline-end:1px solid var(--hairline);
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    padding:16px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:14px;
    border-bottom:1px solid var(--hairline);
  }
  .sidebar-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .app-title{
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.2px;
    color:var(--ink);
    text-align:right;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .app-logo{
    width:22px;
    height:22px;
    border-radius:var(--r-sm);
    background:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(94,106,210,.35), 0 0 20px rgba(94,106,210,.18);
  }
  .app-logo svg{ width:13px; height:13px; color:#fff; }
  .app-title .sub{ color:var(--ink-subtle); font-weight:400; }

  .header-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:var(--r-md);
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-subtle);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition: background-color .18s var(--ease-smooth),
                color .18s var(--ease-smooth),
                border-color .18s var(--ease-smooth);
  }
  .icon-btn:hover{
    background:var(--surface-1);
    color:var(--ink);
    border-color:var(--hairline);
  }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- FILTER TABS ---------- */
  .filter-tabs{
    display:flex;
    position:relative;
    background:var(--surface-1);
    border:1px solid var(--hairline);
    border-radius:var(--r-md);
    padding:3px;
    gap:0;
    overflow:hidden;
  }
  .filter-indicator{
    position:absolute;
    top:3px;
    height:calc(100% - 6px);
    background:var(--surface-3);
    border:1px solid var(--hairline-strong);
    border-radius:var(--r-sm);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
    transition:left .32s var(--ease-smooth),
               width .32s var(--ease-smooth);
    z-index:0;
    will-change:left, width;
  }
  .chip{
    flex:1 1 0;
    text-align:center;
    padding:7px 4px;
    font-size:13px;
    font-weight:500;
    letter-spacing:-0.05px;
    color:var(--ink-subtle);
    cursor:pointer;
    position:relative;
    z-index:1;
    white-space:nowrap;
    user-select:none;
    transition: color .25s var(--ease-smooth);
  }
  .chip.active{ color:var(--ink); }

  .chat-list{
    flex:1;
    overflow-y:auto;
    padding:6px 0;
  }
  .chat-list::-webkit-scrollbar{ width:8px; }
  .chat-list::-webkit-scrollbar-thumb{
    background:var(--surface-3);
    border-radius:4px;
    border:2px solid var(--canvas);
  }

  .chat-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    margin:1px 6px;
    border-radius:var(--r-md);
    cursor:pointer;
    border:1px solid transparent;
    transition: background-color .18s var(--ease-smooth),
                border-color .18s var(--ease-smooth);
  }
  .chat-item:hover{ background:var(--surface-1); }
  .chat-item.active{
    background:var(--surface-2);
    border-color:var(--hairline);
  }

  .avatar{
    width:42px;height:42px;
    min-width:42px;
    border-radius:var(--r-full);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-weight:600;
    font-size:14px;
    letter-spacing:-0.2px;
    position:relative;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .avatar .type-badge{
    position:absolute;
    bottom:-2px;
    inset-inline-end:-2px;
    width:16px;height:16px;
    border-radius:var(--r-full);
    background:var(--surface-2);
    border:2px solid var(--canvas);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;
  }
  .avatar .online-dot{
    position:absolute;
    bottom:0px;
    inset-inline-end:0px;
    width:11px;height:11px;
    border-radius:var(--r-full);
    background:var(--success);
    border:2.5px solid var(--canvas);
    box-shadow:0 0 8px rgba(39,166,68,.5);
  }
  .chat-item.active .avatar .online-dot,
  .chat-item.active .avatar .type-badge{ border-color:var(--surface-2); }

  .chat-info{ flex:1; min-width:0; }
  .chat-info-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .chat-name{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chat-time{
    font-size:11.5px;
    color:var(--ink-subtle);
    flex-shrink:0;
    font-feature-settings:"tnum";
  }
  .chat-info-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-top:3px;
  }
  .chat-preview{
    font-size:13px;
    color:var(--ink-subtle);
    letter-spacing:-0.05px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .unread-badge{
    background:var(--primary);
    color:var(--on-primary);
    font-size:11px;
    font-weight:600;
    min-width:19px;
    height:19px;
    border-radius:var(--r-full);
    display:flex;align-items:center;justify-content:center;
    padding:0 6px;
    flex-shrink:0;
    font-feature-settings:"tnum";
    box-shadow:0 0 0 1px rgba(94,106,210,.4);
  }

  /* ---------- CHAT PANEL ---------- */
  .chat-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    background:var(--canvas);
    position:relative;
  }
  .chat-panel::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 30% 0%, rgba(94,106,210,.06), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(94,106,210,.03), transparent 40%);
    pointer-events:none;
  }
  .chat-panel-empty{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--ink-subtle);
    gap:14px;
    position:relative;
    z-index:1;
  }
  .chat-panel-empty .big-icon{
    width:64px;
    height:64px;
    border-radius:var(--r-xl);
    background:var(--surface-1);
    border:1px solid var(--hairline);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-subtle);
  }
  .chat-panel-empty .big-icon svg{ width:28px; height:28px; }
  .chat-panel-empty p{
    font-size:13.5px;
    color:var(--ink-subtle);
    letter-spacing:-0.1px;
  }

  /* ---------- CHAT HEADER ---------- */
  .chat-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    background:var(--canvas);
    border-bottom:1px solid var(--hairline);
    flex-shrink:0;
    position:relative;
    z-index:2;
  }
  .back-btn-round{
    width:36px;
    height:36px;
    border-radius:var(--r-md);
    border:1px solid var(--hairline);
    background:var(--surface-1);
    color:var(--ink-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background-color .18s var(--ease-smooth),
                border-color .18s var(--ease-smooth),
                color .18s var(--ease-smooth);
  }
  .back-btn-round:hover{
    background:var(--surface-2);
    border-color:var(--hairline-strong);
    color:var(--ink);
  }
  .back-btn-round svg{ width:16px; height:16px; }

  .chat-header-profile{
    margin-inline-start:auto;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    padding:4px 6px 4px 4px;
    border-radius:var(--r-md);
    border:1px solid transparent;
    min-width:0;
    flex-direction:row-reverse;
    transition: background-color .18s var(--ease-smooth),
                border-color .18s var(--ease-smooth);
  }
  .chat-header-profile:hover{
    background:var(--surface-1);
    border-color:var(--hairline);
  }
  .chat-header-profile .avatar{
    width:34px; height:34px; min-width:34px; font-size:12px;
  }
  .chat-header-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:left;
  }
  .chat-header-name{
    font-size:14px;
    font-weight:600;
    letter-spacing:-0.15px;
    color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-align:left;
    line-height:1.2;
  }
  .chat-header-sub{
    font-size:12px;
    color:var(--ink-subtle);
    margin-top:1px;
    letter-spacing:-0.05px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-align:left;
  }
  .chat-header-sub.online{ color:var(--primary-hover); font-weight:500; }

  /* ---------- MESSAGES ---------- */
  .messages-area{
    flex:1;
    overflow-y:auto;
    padding:20px 24px;
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
    z-index:1;
  }
  .messages-area::-webkit-scrollbar{ width:8px; }
  .messages-area::-webkit-scrollbar-thumb{
    background:var(--surface-3);
    border-radius:4px;
    border:2px solid var(--canvas);
  }

  @keyframes pulse{
    0%{opacity:.4;} 50%{opacity:.8;} 100%{opacity:.4;}
  }
  .skel-row{ display:flex; gap:8px; max-width:70%; }
  .skel-row.out{ align-self:flex-end; flex-direction:row-reverse;}
  .skel-row.in{ align-self:flex-start;}
  .skel-avatar{
    width:28px;height:28px;border-radius:var(--r-full);
    background:var(--surface-3);
    animation:pulse .8s ease-in-out infinite;
    flex-shrink:0;
  }
  .skel-bubble{
    background:var(--surface-3);
    border-radius:var(--r-lg);
    animation:pulse .8s ease-in-out infinite;
  }

  .msg-day-divider{
    align-self:center;
    background:var(--surface-1);
    border:1px solid var(--hairline);
    color:var(--ink-subtle);
    font-size:11px;
    font-weight:500;
    letter-spacing:0.2px;
    padding:4px 12px;
    border-radius:var(--r-full);
    margin:6px 0 12px;
  }

  .msg-row{
    display:flex;
    gap:8px;
    max-width:72%;
    animation:fadeIn .18s var(--ease-smooth);
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);} }
  .msg-row.out{ align-self:flex-end; flex-direction:row-reverse;}
  .msg-row.in{ align-self:flex-start;}

  .msg-avatar{
    width:28px;height:28px;border-radius:var(--r-full);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:600;
    flex-shrink:0;
    align-self:flex-end;
    box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
  }

  .msg-bubble{
    padding:9px 13px 7px;
    border-radius:var(--r-lg);
    font-size:14px;
    line-height:1.55;
    letter-spacing:-0.05px;
    position:relative;
  }
  .msg-row.out .msg-bubble{
    background:rgba(94,106,210,.16);
    border:1px solid rgba(94,106,210,.28);
    color:var(--ink);
    border-bottom-right-radius:var(--r-xs);
  }
  .msg-row.in .msg-bubble{
    background:var(--surface-1);
    border:1px solid var(--hairline);
    color:var(--ink);
    border-bottom-left-radius:var(--r-xs);
  }
  .msg-sender{
    font-size:12px;
    font-weight:600;
    letter-spacing:-0.1px;
    margin-bottom:3px;
  }
  .msg-time{
    font-size:10.5px;
    color:var(--ink-subtle);
    display:block;
    text-align:left;
    margin-top:4px;
    font-feature-settings:"tnum";
  }
  .msg-row.out .msg-time{ color:rgba(215,220,235,.55); }

  .post-row{
    align-self:stretch;
    max-width:100%;
    background:var(--surface-1);
    border:1px solid var(--hairline);
    border-radius:var(--r-lg);
    padding:14px 16px;
    animation:fadeIn .18s var(--ease-smooth);
    box-shadow:0 1px 0 rgba(255,255,255,.025) inset;
  }
  .post-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .post-header .avatar{width:26px;height:26px;min-width:26px;font-size:11px;}
  .post-header .channel-name{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-muted);
  }
  .post-text{
    font-size:14px;
    line-height:1.6;
    letter-spacing:-0.05px;
    color:var(--ink);
  }
  .post-footer{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:11.5px;
    color:var(--ink-subtle);
    font-feature-settings:"tnum";
  }

  /* ---------- COMPOSER ---------- */
  .composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:12px 16px;
    background:var(--canvas);
    border-top:1px solid var(--hairline);
    flex-shrink:0;
    position:relative;
    z-index:2;
  }
  .composer-input-wrap{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--surface-1);
    border:1px solid var(--hairline);
    border-radius:var(--r-lg);
    padding:4px 6px;
    gap:2px;
    min-width:0;
    transition: border-color .22s var(--ease-smooth),
                box-shadow .22s var(--ease-smooth),
                background-color .22s var(--ease-smooth);
  }
  .composer-input-wrap:focus-within{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(94,106,210,.18);
    background:var(--surface-2);
  }
  .composer-input-wrap input{
    flex:1;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    outline:none;
    padding:8px 6px;
    color:var(--ink);
    min-width:0;
  }
  .composer-input-wrap input::placeholder{ color:var(--ink-tertiary); }

  .composer-icon-btn{
    width:32px;
    height:32px;
    border-radius:var(--r-sm);
    border:none;
    background:transparent;
    color:var(--ink-subtle);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background-color .18s var(--ease-smooth),
                color .18s var(--ease-smooth);
  }
  .composer-icon-btn:hover{ background:var(--surface-3); color:var(--ink); }
  .composer-icon-btn svg{ width:17px; height:17px; }

  .send-btn{
    width:40px;
    height:40px;
    border-radius:var(--r-md);
    border:none;
    background:var(--primary);
    color:var(--on-primary);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(94,106,210,.5), 0 4px 12px rgba(94,106,210,.28);
    transition: background-color .18s var(--ease-smooth),
                box-shadow .18s var(--ease-smooth);
  }
  .send-btn:hover{
    background:var(--primary-hover);
    box-shadow:0 0 0 1px rgba(130,143,255,.55), 0 6px 18px rgba(94,106,210,.42);
  }
  .send-btn svg{
    width:17px; height:17px;
    transform:scaleX(-1);
  }

  /* ---------- SEARCH PAGE ---------- */
  .search-page{
    position:absolute;
    inset:0;
    z-index:20;
    background:var(--canvas);
    display:none;
    flex-direction:column;
  }
  .search-page.open{ display:flex; animation:fadeIn .18s var(--ease-smooth); }
  .search-page-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 16px;
    border-bottom:1px solid var(--hairline);
    flex-shrink:0;
  }
  .search-page-header input{
    flex:1;
    border:1px solid var(--hairline);
    background:var(--surface-1);
    border-radius:var(--r-md);
    padding:10px 14px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    color:var(--ink);
    min-width:0;
    transition: border-color .18s var(--ease-smooth),
                box-shadow .18s var(--ease-smooth);
  }
  .search-page-header input::placeholder{ color:var(--ink-tertiary); }
  .search-page-header input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(94,106,210,.18);
  }
  .search-results{ flex:1; overflow-y:auto; padding:6px 0; }
  .search-results::-webkit-scrollbar{ width:8px; }
  .search-results::-webkit-scrollbar-thumb{
    background:var(--surface-3);
    border-radius:4px;
    border:2px solid var(--canvas);
  }
  .search-section-title{
    font-size:11px;
    font-weight:500;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--ink-tertiary);
    padding:14px 22px 8px;
  }
  .search-result-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    margin:1px 6px;
    border-radius:var(--r-md);
    border:1px solid transparent;
    cursor:pointer;
    transition: background-color .18s var(--ease-smooth),
                border-color .18s var(--ease-smooth);
  }
  .search-result-item:hover{ background:var(--surface-1); border-color:var(--hairline); }
  .search-result-item .avatar{ width:38px;height:38px;min-width:38px;font-size:13px; }
  .search-result-info{flex:1;min-width:0;}
  .search-result-name{
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);

    right:0;

  .profile-cover-status{

    gap:8px;

    padding:6px 14px 6px 12px;

    background:rgba(15,16,17,.32);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);

  .profile-content{
    padding:24px 22px 48px;
    display:flex;
    flex-direction:column;
    gap:20px;
    max-width:640px;
    width:100%;

    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,

    align-items:flex-start;
    gap:12px;
    padding:14px 16px;

    border-top:1px solid rgba(255,255,255,.06);

    width:20px;
    height:20px;
    color:var(--primary-hover);

    margin-top:1px;

    margin-bottom:3px;
    letter-spacing:0.4px;
    text-transform:uppercase;

    font-size:13.5px;
    color:var(--ink);
    word-break:break-word;
    line-height:1.55;
    letter-spacing:-0.05px;

  .profile-section-label{
    font-size:11px;
    font-weight:500;
    letter-spacing:0.4px;
    text-transform:uppercase;

    font-weight:500;

    visibility:hidden;

  }

    opacity:1;
    visibility:visible;
    transition: opacity .28s var(--ease-smooth),
                visibility 0s linear 0s;
  }

    left:0;
    right:0;
    bottom:0;
    width:100%;
    background:var(--surface-1);
    border-top:1px solid var(--hairline-strong);
    border-radius:var(--r-xl) var(--r-xl) 0 0;

    max-height:90%;
    overflow-y:auto;
    padding:8px 0 max(16px, env(safe-area-inset-bottom));

    height:4px;

    align-items:center;
    text-align:center;
    gap:6px;

    height:48px;

  }

    padding:6px 0;
  }

  .sheet-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:inherit;
    font-size:14.5px;
    font-weight:500;
    letter-spacing:-0.1px;
    cursor:pointer;
    text-align:start;
    transition: background-color .18s var(--ease-smooth);
  }

    border-top:1px solid var(--hairline);
  }
  .sheet-item-icon{
    width:22px;
    height:22px;
    color:var(--ink-subtle);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sheet-item-icon svg{ width:100%; height:100%; }
  .sheet-item-label{ flex:1; }
  .sheet-item-hint{
    font-size:12.5px;
    color:var(--ink-tertiary);
    letter-spacing:-0.05px;
    margin-top:1px;
    font-weight:400;

  .sheet-actions{
    display:flex;
    gap:10px;
    padding:14px 20px 4px;
  }
  .sheet-btn{
    flex:1;
    border-radius:var(--r-md);
    padding:12px 16px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    letter-spacing:-0.05px;
    cursor:pointer;
    border:1px solid transparent;
    transition: background-color .18s var(--ease-smooth),
                border-color .18s var(--ease-smooth);
  }

  .sheet-btn.ghost{
    background:var(--surface-2);
    border-color:var(--hairline);
    color:var(--ink);
  }
  .sheet-btn.ghost:hover{ background:var(--surface-3); border-color:var(--hairline-strong); }

  .sheet-btn.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:var(--on-primary);

function typeBadge(type){
  if(type==='group') return '👥';
  if(type==='channel') return '📢';
  return '';
}
function esc(s){
  return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}
function hl(text, term){
  const safe = esc(text);
  if(!term) return safe;
  const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(t,'gi'), m => `<mark>${m}</mark>`);
}

/* ============================================
   RIPPLE
   ============================================ */
function attachRipple(el, variant){
  if(!el || el.dataset.rippleAttached === '1') return;
  el.dataset.rippleAttached = '1';
  if(!el.classList.contains('ripple-host')) el.classList.add('ripple-host');
  el.addEventListener('pointerdown', e=>{
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.2;
    const x = (e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? (rect.left + rect.width/2)) - rect.left;
    const y = (e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? (rect.top + rect.height/2)) - rect.top;
    const r = document.createElement('span');
    r.className = 'ripple' + (variant ? ' on-' + variant : '');
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    el.appendChild(r);
    setTimeout(()=>r.remove(), 700);
  }, {passive:true});
}
function attachRippleAll(root=document){
  root.querySelectorAll('.ripple-host').forEach(el=>attachRipple(el));
}

   ============================================ */
function openSheet(contentHTML){
  sheet.innerHTML = contentHTML;
  sheetOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  attachRippleAll(sheet);
}
function closeSheet(){
  sheetOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
function sheetContent(parts){
  return `<div class="sheet-handle"></div>${parts}`;
}
function showConfirm({title, subtitle, confirmLabel, cancelLabel, variant = 'primary', icon = 'check', onConfirm}){
  const iconClass = variant === 'danger' ? 'danger' : (variant === 'primary' ? 'primary' : 'neutral');
  const btnClass  = variant === 'danger' ? 'danger' : 'primary';
  openSheet(sheetContent(`
    <div class="sheet-header">
      <div class="sheet-icon ${iconClass}">${ICONS[icon] || ICONS.check}</div>
      <div class="sheet-title">${esc(title)}</div>
      ${subtitle ? `<div class="sheet-subtitle">${esc(subtitle)}</div>` : ''}
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn ghost ripple-host" id="sheetCancelBtn">${esc(cancelLabel || 'انصراف')}</button>
      <button class="sheet-btn ${btnClass} ripple-host" id="sheetConfirmBtn">${esc(confirmLabel || 'تایید')}</button>
    </div>
  `));
  document.getElementById('sheetCancelBtn').onclick = closeSheet;
  document.getElementById('sheetConfirmBtn').onclick = () => {
    closeSheet();
    if(onConfirm) setTimeout(onConfirm, 280);
  };
}
function showActionSheet({items, title, subtitle}){
  const rows = items.map(item => `
    <button class="sheet-item ripple-host ${item.variant || ''}" data-key="${item.key}">
      <div class="sheet-item-icon">${item.icon || ICONS.info}</div>
      <div class="sheet-item-label">
        <div>${esc(item.label)}</div>
        ${item.hint ? `<div class="sheet-item-hint">${esc(item.hint)}</div>` : ''}
      </div>
    </button>
  `).join('');
  openSheet(sheetContent(`
    <div class="sheet-header ${!title && !subtitle ? 'no-border' : ''}">
      ${title ? `<div class="sheet-title">${esc(title)}</div>` : ''}
      ${subtitle ? `<div class="sheet-subtitle">${esc(subtitle)}</div>` : ''}
    </div>
    <div class="sheet-body">${rows}</div>
  `));
  sheet.querySelectorAll('.sheet-item').forEach(el=>{
    el.onclick = () => {
      const item = items.find(i => i.key === el.dataset.key);
      if(item && item.onSelect){
        closeSheet();
        setTimeout(()=>item.onSelect(), 280);
      }
    };
  });
}

function renderList(){
  chatList.innerHTML = '';
  chats
    .filter(c => currentFilter==='all' || c.type===currentFilter)
    .forEach(c=>{
      const item = document.createElement('div');
      item.className = 'chat-item ripple-host' + (c.id===activeId ? ' active':'');
      item.dataset.id = c.id;
      item.innerHTML = `
        <div class="avatar" style="background:${c.color}">
          ${c.initials}
          ${c.type!=='private' ? `<div class="type-badge">${typeBadge(c.type)}</div>` : (c.online ? '<div class="online-dot"></div>' : '')}
        </div>
        <div class="chat-info">
          <div class="chat-info-top">
            <div class="chat-name">${c.name}</div>
            <div class="chat-time">${c.time}</div>
          </div>
          <div class="chat-info-bottom">
            <div class="chat-preview">${c.preview}</div>
            ${c.unread ? `<div class="unread-badge">${c.unread}</div>` : ''}
          </div>
        </div>
      `;

      let pressTimer = null;
      let longPressFired = false;

      const startPress = () => {
        longPressFired = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(()=>{
          longPressFired = true;
          if(navigator.vibrate) navigator.vibrate(20);
          showChatActionSheet(c);
        }, 480);
      };
      const cancelPress = () => {
        clearTimeout(pressTimer);
        pressTimer = null;
      };

      item.addEventListener('pointerdown', startPress);
      item.addEventListener('pointerup', cancelPress);
      item.addEventListener('pointercancel', cancelPress);
      item.addEventListener('pointerleave', cancelPress);

      item.addEventListener('click', (e)=>{
        if(longPressFired){
          longPressFired = false;
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        openChat(c.id);
      });

      chatList.appendChild(item);
    });
  attachRippleAll(chatList);
}

        variant:'danger',
        icon:'warning',
        onConfirm:()=>showInfoSheet({title: isGroup ? 'از گروه خارج شدید' : 'اشتراک لغو شد', subtitle:c.name, icon:'block', variant:'danger'})
      })
    });
  }

  showActionSheet({ title: c.name, subtitle: c.sub, items });
}

/* ---------- skeleton ---------- */
function skeletonHTML(type){
  const pattern = type==='channel'
    ? [ {w:'92%',h:70,side:'in'}, {w:'80%',h:50,side:'in'} ]
    : [
        {w:'55%',h:36,side:'in'},
        {w:'40%',h:32,side:'out'},
        {w:'62%',h:44,side:'in'},
        {w:'35%',h:28,side:'out'},
        {w:'48%',h:34,side:'in'},
      ];
  return pattern.map(p=>{
    if(type==='channel'){
      return `<div class="skel-bubble" style="width:${p.w}; height:${p.h}px; align-self:stretch;"></div>`;
    }
    const withAvatar = p.side==='in' && type==='group';
    return `<div class="skel-row ${p.side}">
      ${withAvatar ? '<div class="skel-avatar"></div>' : ''}
      <div class="skel-bubble" style="width:${p.w}; height:${p.h}px;"></div>
    </div>`;
  }).join('');
}

function headerHTML(c){
  const isOnline = c.online && c.type==='private';
  return `
    <div class="chat-header">
      <button class="back-btn-round ripple-host" id="backBtn" title="بازگشت">
        ${ICONS.back}
      </button>
      <div class="chat-header-profile ripple-host" id="openProfileBtn" title="مشاهده اطلاعات">
        <div class="avatar" style="background:${c.color}">
          ${c.initials}
          ${isOnline ? '<div class="online-dot"></div>' : ''}
        </div>
        <div class="chat-header-info">
          <div class="chat-header-name">${c.name}</div>
          <div class="chat-header-sub ${isOnline?'online':''}">${c.sub}</div>
        </div>
      </div>
    </div>
  `;
}

function messagesHTML(c){
  if(c.type==='channel'){
    return c.posts.map(p=>`
      <div class="post-row">
        <div class="post-header">
          <div class="avatar" style="background:${c.color}">${c.initials}</div>
          <div class="channel-name">${c.name}</div>
        </div>
        <div class="post-text">${p.text}</div>
        <div class="post-footer">
          <span>👁 ${p.views}</span>
          <span>${p.time}</span>
        </div>
      </div>
    `).join('');
  }
  return `<div class="msg-day-divider">امروز</div>` + c.messages.map(m=>{
    if(c.type==='group' && !m.out){
      return `<div class="msg-row in">
        <div class="msg-avatar" style="background:${m.color}">${m.sender[0]}</div>
        <div class="msg-bubble">
          <div class="msg-sender" style="color:${m.color}">${m.sender}</div>
          ${m.text}
          <span class="msg-time">${m.time}</span>
        </div>
      </div>`;
    }
    return `<div class="msg-row ${m.out?'out':'in'}">
      <div class="msg-bubble">
        ${m.text}
        <span class="msg-time">${m.time}</span>
      </div>
    </div>`;
  }).join('');
}

function composerHTML(c){
  const placeholder = c.type==='channel' ? 'نظر خود را بنویسید...' : 'پیام...';
  return `
    <div class="composer">
      <div class="composer-input-wrap">
        <button class="composer-icon-btn ripple-host" title="ایموجی">${ICONS.smile}</button>
        <input type="text" placeholder="${placeholder}">
        <button class="composer-icon-btn ripple-host" title="پیوست">${ICONS.clip}</button>
      </div>
      <button class="send-btn ripple-host" title="ارسال">${ICONS.send}</button>
    </div>
  `;
}

/* ============================================
   FULL-SCREEN PROFILE PAGE
   ============================================ */
function profileInfoRow(icon, label, value){
  return `
    <div class="profile-info-row">
      <div class="profile-info-icon">${icon}</div>
      <div class="profile-info-content">
        <div class="profile-info-label">${label}</div>
        <div class="profile-info-value">${value}</div>
      </div>
    </div>
  `;
}

function profileActionButton({action, icon, label, variant}){
  return `
    <button class="profile-action-btn ripple-host ${variant || ''}" data-action="${action}">
      ${icon}
      <span class="label">${label}</span>
      <span class="arrow">${ICONS.chevron}</span>
    </button>
  `;
}

function renderProfilePage(c){
  const isPrivate = c.type === 'private';
  const isOnline = c.online && isPrivate;
  const coverImg = c.coverImage ? `<img class="profile-cover-img" src="${c.coverImage}" alt="">` : '';
  const coverFallback = c.coverImage ? '' : `<div class="profile-cover-fallback" style="background:linear-gradient(135deg, ${c.color}, ${shade(c.color, -28)})">${c.initials}</div>`;

  // Info card (no notifications, no stats)
  let infoRows = '';
  if(isPrivate){
    if(c.username) infoRows += profileInfoRow(ICONS.at, 'نام کاربری', c.username);
    if(c.phone)    infoRows += profileInfoRow(ICONS.phone, 'شماره تلفن', c.phone);
    if(c.bio)      infoRows += profileInfoRow(ICONS.info, 'درباره', c.bio);
  } else {
    if(c.memberCount) infoRows += profileInfoRow(ICONS.users, c.type==='group'?'تعداد اعضا':'تعداد مشترکین', c.memberCount);
    if(c.description) infoRows += profileInfoRow(ICONS.info, 'توضیحات', c.description);
  }

  // Actions (no notifications)
  let actions = '';
  if(isPrivate){
    actions = `
      ${profileActionButton({action:'block', icon:ICONS.block, label:'بلاک کردن', variant:'danger'})}
      ${profileActionButton({action:'clear', icon:ICONS.broom, label:'پاک کردن تاریخچه', variant:'danger'})}
      ${profileActionButton({action:'delete', icon:ICONS.trash, label:'حذف چت', variant:'danger'})}
    `;
  } else {
    actions = `
      ${profileActionButton({action:'leave', icon:ICONS.block, label: c.type==='group'?'خروج از گروه':'لغو اشتراک', variant:'danger'})}
      ${profileActionButton({action:'clear', icon:ICONS.broom, label:'پاک کردن تاریخچه', variant:'danger'})}
      ${profileActionButton({action:'delete', icon:ICONS.trash, label:'حذف چت', variant:'danger'})}
    `;
  }

  const statusLabel = isOnline
    ? 'آنلاین'
    : (isPrivate ? 'آخرین بازدید' : (c.type==='group' ? 'گروه' : 'کانال'));

  return `
    <div class="profile-cover">
      ${coverFallback}
      ${coverImg}
      <div class="profile-cover-scrim"></div>

      <div class="profile-cover-top">
        <button class="cover-btn ripple-host" id="profileBackBtn" title="بازگشت">
          ${ICONS.back}
        </button>
      </div>

      <div class="profile-cover-caption">
        <div class="profile-cover-name">${c.name}</div>
        <div class="profile-cover-status ${isOnline?'':'offline'}">
          <span class="dot"></span>
          <span class="label">${statusLabel}</span>
          <span>${isOnline ? '' : c.sub}</span>
        </div>
      </div>
    </div>

    <div class="profile-content">
      ${infoRows ? `<div class="profile-info-card">${infoRows}</div>` : ''}

      <div class="profile-section-label">عملیات</div>
      <div class="profile-actions">${actions}</div>
    </div>
  `;
}

function shade(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
}

function openProfileModal(c){
  profilePage.innerHTML = renderProfilePage(c);
  profilePage.classList.add('open');
  profilePage.scrollTop = 0;
  attachRippleAll(profilePage);

  document.getElementById('profileBackBtn').addEventListener('click', closeProfileModal);

  profilePage.querySelectorAll('.profile-action-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      handleProfileAction(btn.dataset.action, c);
    });
  });
}

function closeProfileModal(){
  profilePage.classList.remove('open');
}

/* ---------- profile actions ---------- */
function handleProfileAction(action, c){
  switch(action){
    case 'block':
      showConfirm({
        title:`بلاک کردن «${c.name}»؟`,
        subtitle:'دیگر پیامی از این کاربر دریافت نخواهید کرد و نمی‌تواند به شما پیام دهد.',
        confirmLabel:'بلاک کن', variant:'danger', icon:'warning',
        onConfirm:()=>showInfoSheet({title:`${c.name} بلاک شد`, subtitle:'می‌توانید از تنظیمات آنبلاک کنید.', icon:'block', variant:'danger'})
      });
      break;

    case 'leave':
      showConfirm({
        title: c.type==='group' ? `خروج از «${c.name}»؟` : `لغو اشتراک «${c.name}»؟`,
        subtitle: 'پس از خروج، دیگر پیامی از این ' + (c.type==='group'?'گروه':'کانال') + ' دریافت نخواهید کرد.',
        confirmLabel: c.type==='group'?'خروج':'لغو اشتراک', variant:'danger', icon:'warning',
        onConfirm:()=>showInfoSheet({title: c.type==='group'?'از گروه خارج شدید':'اشتراک لغو شد', subtitle:`دیگر عضو «${c.name}» نیستید.`, icon:'block', variant:'danger'})
      });
      break;

    case 'clear':
      showConfirm({
        title:`پاک کردن تاریخچه «${c.name}»؟`,
        subtitle:'پیام‌ها حذف می‌شوند اما چت باقی می‌ماند.',
        confirmLabel:'پاک کن', variant:'danger', icon:'warning',
        onConfirm:()=>showInfoSheet({title:'پاک شد', subtitle:'تاریخچه پیام‌ها پاک شد.', icon:'broom', variant:'danger'})
      });
      break;

    case 'delete':
      showConfirm({
        title:`حذف چت «${c.name}»؟`,
        subtitle:'این عملیات قابل بازگشت نیست و تمام پیام‌های این گفتگو حذف خواهند شد.',
        confirmLabel:'حذف کن', variant:'danger', icon:'trash',
        onConfirm:()=>{
          closeProfileModal();
          showInfoSheet({title:'چت حذف شد', subtitle:`تمام پیام‌های «${c.name}» حذف شدند.`, icon:'trash', variant:'danger'});
        }
      });
      break;
  }
}

/* ---------- open / close chat ---------- */
function openChat(id){
  activeId = id;
  const c = chats.find(x=>x.id===id);
  if(c.unread) c.unread = 0;
  renderList();

  appEl.classList.remove('no-anim');
  appEl.classList.add('chat-open');

  chatPanel.innerHTML = headerHTML(c) +
    `<div class="messages-area" id="messagesArea">${skeletonHTML(c.type)}</div>` +
    composerHTML(c);

  attachRippleAll(chatPanel);

  document.getElementById('backBtn').addEventListener('click', closeChat);
  document.getElementById('openProfileBtn').addEventListener('click', ()=>openProfileModal(c));

  const area = document.getElementById('messagesArea');
  setTimeout(()=>{
    area.innerHTML = messagesHTML(c);
    area.scrollTop = area.scrollHeight;
  }, 220);
}

function closeChat(){
  if(window.innerWidth > 820){
    activeId = null;
    renderList();
    chatPanel.innerHTML = `
      <div class="chat-panel-empty" id="emptyState">
        <div class="big-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <p>یک گفتگو را برای شروع انتخاب کنید</p>
      </div>
    `;
    return;
  }
  appEl.classList.add('no-anim');
  appEl.classList.remove('chat-open');
  void appEl.offsetWidth;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    appEl.classList.remove('no-anim');
  }));
}

/* ---------- search page ---------- */
function openSearchPage(){
  searchPage.classList.add('open');
  searchPageInput.value = '';
  renderSearchResults('');
  setTimeout(()=>searchPageInput.focus(), 30);
}
function closeSearchPage(){
  searchPage.classList.remove('open');
}

function renderSearchResults(term){
  const t = term.trim();
  const rows = [];

  chats.forEach(c=>{
    if(!t || c.name.includes(t)){
      rows.push({chat:c, snippet:c.preview});
    }
    if(t){
      const texts = [];
      if(c.messages) c.messages.forEach(m=>texts.push(m.text));
      if(c.posts)    c.posts.forEach(p=>texts.push(p.text));
      texts.forEach(txt=>{
        if(txt.includes(t)) rows.push({chat:c, snippet:txt});
      });
    }
  });

  if(!rows.length){
    searchResults.innerHTML = `<div class="search-empty">نتیجه‌ای یافت نشد</div>`;
    return;
  }

  searchResults.innerHTML =
    `<div class="search-section-title">${t ? 'نتایج جستجو' : 'همه گفتگوها'}</div>` +
    rows.map(r=>`
      <div class="search-result-item ripple-host" data-id="${r.chat.id}">
        <div class="avatar" style="background:${r.chat.color}">${r.chat.initials}</div>
        <div class="search-result-info">
          <div class="search-result-name">${hl(r.chat.name, t)}</div>
          <div class="search-result-snippet">${hl(r.snippet, t)}</div>
        </div>
      </div>
    `).join('');

  searchResults.querySelectorAll('.search-result-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      closeSearchPage();
      openChat(Number(el.dataset.id));
    });
  });
  attachRippleAll(searchResults);
}

/* ---------- bindings ---------- */
document.getElementById('searchOpenBtn').addEventListener('click', openSearchPage);
document.getElementById('searchBackBtn').addEventListener('click', closeSearchPage);
document.getElementById('searchClearBtn').addEventListener('click', ()=>{
  searchPageInput.value = '';
  renderSearchResults('');
  searchPageInput.focus();
});
searchPageInput.addEventListener('input', e => renderSearchResults(e.target.value));

sheetOverlay.addEventListener('click', e=>{
  if(e.target === sheetOverlay) closeSheet();
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(sheetOverlay.classList.contains('open')) closeSheet();
    else if(profilePage.classList.contains('open')) closeProfileModal();
    else if(searchPage.classList.contains('open')) closeSearchPage();
  }
});

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    if(chip.classList.contains('active')) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    updateIndicator();
    renderList();
  });
});

function updateIndicator(){
  const activeChip = document.querySelector('.chip.active');
  const indicator  = document.getElementById('filterIndicator');
  if(!activeChip || !indicator) return;
  indicator.style.left  = activeChip.offsetLeft + 'px';
  indicator.style.width = activeChip.offsetWidth + 'px';
}

/* ---------- init ---------- */
renderList();
attachRippleAll(document);
requestAnimationFrame(()=>{
  updateIndicator();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(updateIndicator);
  }
});
window.addEventListener('resize', updateIndicator);
</script>
</body>
</html>
