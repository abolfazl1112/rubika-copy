:root{
  --bg:#fff;--bg2:#f4f4f5;--text:#000;--text2:#707579;--primary:#3390ec;

html[data-theme="dark"]{
  --bg:#212121;--bg2:#0f0f0f;--text:#fff;--text2:#aaa;--primary:#8774e1;
  --border:#303030;--hover:#2c2c2c;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  direction:rtl;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;padding-bottom:64px}

.topbar{
  display:flex;align-items:center;gap:.5rem;
  padding:1rem 1rem .75rem;
  border-bottom:1px solid var(--border);
}
.topbar h1{flex:1;font-size:1.375rem;font-weight:600}
.topbar .icon-btn{
  width:2.25rem;height:2.25rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:background-color .15s,color .15s;
  cursor:pointer;border:none;background:transparent;
}
.topbar .icon-btn:hover{background:var(--hover);color:var(--text)}
.topbar .icon-btn svg{width:1.25rem;height:1.25rem;display:block}

.whoami{
  padding:.75rem 1rem;font-size:.875rem;
  color:var(--text2);border-bottom:1px solid var(--border);
}
.whoami b{color:var(--text);font-weight:500}

.grid{
  padding:1rem;display:grid;
  grid-template-columns:1fr 1fr;gap:.625rem;
}
.tile{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.5rem;
  padding:1.5rem 1rem;border-radius:1rem;
  background:var(--bg2);color:var(--text);
  text-decoration:none;cursor:pointer;
  transition:background-color .15s,transform .1s;
  border:none;font-family:inherit;font-size:inherit;
}
.tile:hover{background:var(--hover)}
.tile:active{transform:scale(.98)}
.tile svg{
  width:2rem;height:2rem;color:var(--primary);
  stroke-width:2;
}
.tile span{font-size:.9375rem;font-weight:500}

.actions{padding:0 1rem;display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
.btn{
  width:100%;height:3rem;border:none;border-radius:1.75rem;
  font-family:inherit;font-size:1rem;font-weight:500;
  cursor:pointer;transition:background-color .15s,color .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
}
.btn.outline{
  background:transparent;border:1px solid var(--border);
  color:var(--text);
}
.btn.outline:hover{background:var(--hover)}
.btn.danger{background:transparent;border:1px solid var(--border);color:var(--err)}
.btn.danger:hover{background:rgba(229,57,53,.08)}

.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;padding:.375rem 0 max(.375rem, env(safe-area-inset-bottom));

}
.bottom-nav a{

  gap:.125rem;padding:.375rem .25rem;
  font-size:.6875rem;font-weight:500;
  color:var(--text2);text-decoration:none;
  transition:color .15s;
}
.bottom-nav a svg{width:1.5rem;height:1.5rem;display:block}
.bottom-nav a.active{color:var(--primary)}
</style>

<script>
"use strict";

var Theme = {
  current: function(){
    try{ return localStorage.getItem("rb_theme") || "light" }catch(e){ return "light" }
  },
  apply: function(t){
    document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("rb_theme", t) }catch(e){}
    updateThemeIcon();
  },
  toggle: function(){ this.apply(this.current() === "dark" ? "light" : "dark") }
};

function updateThemeIcon(){
  var btn = document.getElementById("themeBtn");
  if(!btn) return;
  var isDark = Theme.current() === "dark";
  btn.innerHTML = isDark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}

Theme.apply(Theme.current());
document.getElementById("themeBtn").onclick = function(){ Theme.toggle() };

document.getElementById("logout").onclick = function(){
  fetch("/api/auth/logout", {method: "POST", credentials: "same-origin"})
    .catch(function(){})
    .finally(function(){
      try{ localStorage.removeItem("rb_token") }catch(e){}
      window.location.replace("/login");
    });
};

/* چک auth — اگه ۴۰۱ گرفتیم بدون ریلود به لاگین می‌ریم */
fetch("/api/me", {credentials: "same-origin"})
  .then(function(r){
    if(!r.ok){ window.location.replace("/login"); return }
    return r.json();
  })
  .then(function(j){
    if(j && j.telegram_id){
      document.getElementById("whoami").textContent = j.telegram_id;
    }
  })
  .catch(function(){
    document.getElementById("whoami").textContent = "خطای شبکه";
  });
</script>
