<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>تنظیمات</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f1f1f3;--bg3:#e7e7ea;--text:#0f0f10;--text2:#707579;--icon2:#707579;
--meta:#8b8f95;--border:#e6e8ec;--divider:#d5d9df;--primary:#3390ec;
--primary-tint:rgba(51,144,236,.1);--danger:#e53935;
--font:"Vazirmatn",-apple-system,system-ui,sans-serif;--font-round:"Nunito","Vazirmatn",sans-serif;
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html.theme-dark{--bg:#18191c;--bg2:#232529;--bg3:#2b2e33;--text:#f3f4f6;--text2:#a9adb4;
--icon2:#a9adb4;--meta:#82868d;--border:#2b2e33;--divider:#3a3e45;
--primary:#a08eff;--primary-tint:rgba(160,142,255,.14);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:16px;line-height:1.5;color:var(--text);
background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;direction:rtl}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none;padding:0}
input{font:inherit;color:inherit;outline:none;border:0;background:none}
.icon{display:inline-flex;width:1.5rem;height:1.5rem;flex-shrink:0}
.icon svg{width:100%;height:100%;display:block}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* TopBar */
.TopBar{position:absolute;top:0;left:0;right:0;z-index:20;
display:flex;align-items:center;gap:.5rem;
padding:.5rem;padding-top:calc(.75rem + var(--safe-top));
background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 100%);
min-height:3.75rem;transition:background .25s,border-color .25s}
.TopBar.scrolled{background:color-mix(in srgb,var(--bg) 88%,transparent);
-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
border-bottom:1px solid var(--border)}
.TopBar .icon-btn{width:2.5rem;height:2.5rem;border-radius:50%;display:flex;
align-items:center;justify-content:center;color:#fff;
background:rgba(0,0,0,.35);transition:background .15s,color .15s}
.TopBar .icon-btn:hover{background:rgba(0,0,0,.55)}
.TopBar .title{flex:1;font-size:1rem;font-weight:600;color:#fff;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
opacity:0;transition:opacity .2s;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.TopBar.scrolled .title{opacity:1;color:var(--text);text-shadow:none}
.TopBar.scrolled .icon-btn{background:var(--primary-tint);color:var(--primary)}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
-webkit-overflow-scrolling:touch;padding-bottom:3rem}

/* Hero gallery */
.hero{position:relative;width:100%;aspect-ratio:1/1;
max-height:min(80vh,520px);overflow:hidden;background:var(--bg2);
touch-action:pan-y}
.gallery-track{display:flex;width:100%;height:100%;
transition:transform .35s cubic-bezier(.2,.9,.3,1);will-change:transform}
.gallery-track.dragging{transition:none}
.gallery-slide{min-width:100%;height:100%;position:relative;overflow:hidden}
.gallery-slide img{position:absolute;inset:0;width:100%;height:100%;
object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.gallery-slide img.loaded{opacity:1}
.gallery-slide .fb{position:absolute;inset:0;display:flex;
align-items:center;justify-content:center;color:#fff;
font-family:var(--font-round);font-weight:800;font-size:7rem}
.gallery-slide .shm{position:absolute;inset:0;
background:linear-gradient(90deg,
  rgba(120,120,130,.08) 0%,
  rgba(120,120,130,.18) 50%,
  rgba(120,120,130,.08) 100%);
background-size:200% 100%;animation:shim 1.4s ease-in-out infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar top */
.gallery-progress{position:absolute;top:0;left:0;right:0;z-index:8;
padding:calc(.125rem + var(--safe-top)) .5rem 0;
display:flex;gap:.1875rem;pointer-events:none}
.gallery-progress .seg{flex:1;height:.1875rem;border-radius:.1875rem;
background:rgba(255,255,255,.3);overflow:hidden;position:relative;
box-shadow:0 1px 2px rgba(0,0,0,.25)}
.gallery-progress .seg .fill{position:absolute;inset:0;width:0%;
background:#fff;border-radius:inherit;
transition:width .35s cubic-bezier(.2,.9,.3,1)}
.gallery-progress .seg.on .fill{width:100%}

.hero .overlay{position:absolute;inset:0;pointer-events:none;z-index:4;
background:linear-gradient(to bottom,
  rgba(0,0,0,0) 45%,
  rgba(0,0,0,.35) 70%,
  rgba(0,0,0,.78) 100%)}
.hero .info{position:absolute;left:0;right:0;bottom:0;z-index:5;
padding:1.5rem 1.25rem;color:#fff;
display:flex;flex-direction:column;align-items:flex-end;gap:.375rem}
.hero .name{font-size:1.75rem;font-weight:700;line-height:1.15;
text-shadow:0 2px 12px rgba(0,0,0,.6);text-align:right;
max-width:100%;word-break:break-word}
.hero .phone{font-size:.875rem;color:rgba(255,255,255,.85);
text-shadow:0 1px 4px rgba(0,0,0,.5);direction:ltr}

/* Chips */
.chips{padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.chip{display:flex;align-items:center;gap:.625rem;
padding:.625rem .875rem;background:var(--bg2);border-radius:.875rem;
transition:background .15s,transform .12s;cursor:pointer}
.chip:hover{background:var(--bg3)}
.chip:active{transform:scale(.98)}
.chip .c-ico{width:2rem;height:2rem;border-radius:.625rem;flex-shrink:0;
display:flex;align-items:center;justify-content:center;
background:var(--primary-tint);color:var(--primary)}
.chip .c-ico .icon{width:1rem;height:1rem}
.chip .c-txt{flex:1;min-width:0}
.chip .c-lbl{font-size:.6875rem;color:var(--text2);font-weight:500;margin-bottom:.125rem}
.chip .c-val{font-size:.875rem;font-weight:500;color:var(--text);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
direction:ltr;text-align:left}
.chip .c-val.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.75rem}
.chip .c-copy{width:1.5rem;height:1.5rem;color:var(--icon2);flex-shrink:0;
opacity:.7;transition:opacity .15s,color .15s}
.chip:hover .c-copy{opacity:1;color:var(--primary)}

/* Sections */
.section{padding:0 1rem;margin-bottom:.75rem}
.section-title{font-size:.6875rem;font-weight:600;color:var(--text2);
padding:.5rem .375rem .375rem;text-transform:uppercase;letter-spacing:.05em}

/* Account rows */
.acct-list{display:flex;flex-direction:column;gap:.375rem}
.acct-row{display:flex;align-items:center;gap:.75rem;
padding:.5rem .75rem;background:var(--bg2);border-radius:.875rem;
cursor:pointer;transition:background .15s,transform .12s}
.acct-row:hover{background:var(--bg3)}
.acct-row:active{transform:scale(.99)}
.acct-row .Avatar{--_s:2.5rem;--_f:.875rem;
width:2.5rem;height:2.5rem;border-radius:50%;flex-shrink:0;
box-shadow:none;
border:2px solid color-mix(in srgb,var(--primary) 30%,transparent);
overflow:hidden;
display:flex;align-items:center;justify-content:center;
font-family:var(--font-round);font-weight:700;color:#fff;font-size:.875rem}
.acct-row .Avatar img{width:100%;height:100%;object-fit:cover;
border-radius:50%;display:block}
.acct-row .row-meta{flex:1;min-width:0;
display:flex;align-items:center;gap:.5rem}
.acct-row .row-name{font-size:.875rem;font-weight:500;color:var(--text);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.acct-row .row-sep{color:var(--meta);font-size:.75rem;flex-shrink:0}
.acct-row .row-phone{font-size:.75rem;color:var(--text2);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
direction:ltr;flex-shrink:1;max-width:45%;min-width:0}
.acct-row .handle{width:1.25rem;height:1.25rem;color:var(--icon2);
flex-shrink:0;opacity:.5}

/* Add account row */
.acct-row.add-row{background:var(--bg2)}
.acct-row.add-row:hover{background:var(--bg3)}
.acct-row.add-row .Avatar.add-plus{border:none;background:var(--primary-tint)!important;color:var(--primary);font-weight:700;font-size:1.25rem}
.acct-row.add-row .row-name{color:var(--text);font-weight:500}

/* Big buttons */
.actions{padding:0 .5rem;display:flex;flex-direction:column;gap:.375rem}
.big-btn{display:flex;align-items:center;gap:.875rem;
padding:.6875rem .875rem;background:var(--bg2);border-radius:.875rem;
color:var(--text);text-align:right;width:100%;
transition:background .15s,transform .12s;cursor:pointer}
.big-btn:hover{background:var(--bg3)}
.big-btn:active{transform:scale(.99)}
.big-btn .b-ico{width:2rem;height:2rem;border-radius:.625rem;flex-shrink:0;
display:flex;align-items:center;justify-content:center;
background:var(--primary-tint);color:var(--primary)}
.big-btn .b-ico .icon{width:1rem;height:1rem}
.big-btn .b-title{flex:1;min-width:0;font-size:.9375rem;font-weight:500;
color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big-btn .b-arrow{width:1rem;height:1rem;color:var(--icon2);
flex-shrink:0;opacity:.5}
.big-btn.danger .b-ico{background:rgba(229,57,53,.12);color:var(--danger)}
.big-btn.danger .b-title{color:var(--danger)}
/* Skeleton */
.sk{background:var(--bg2);border-radius:.5rem;
background:linear-gradient(90deg,
  var(--bg2) 0%,color-mix(in srgb,var(--bg2) 60%,var(--text2) 8%) 50%,
  var(--bg2) 100%);
background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-hero{width:100%;aspect-ratio:1/1;max-height:min(80vh,520px);
position:relative;overflow:hidden}
.sk-chips{padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.sk-chip{height:3.25rem;border-radius:.875rem}
.sk-sec{padding:0 1rem;margin-top:1rem}
.sk-sec .sk-t{height:.75rem;width:30%;border-radius:.5rem;margin-bottom:.5rem}
.sk-btn{height:3rem;border-radius:.875rem;margin-bottom:.375rem}

/* Button loading spinner */
.big-btn.loading,.chip.loading,.acct-row.loading{pointer-events:none;opacity:.75}
.big-btn.loading .b-ico .icon,
.chip.loading .c-ico .icon,
.acct-row.loading .Avatar img{opacity:0}
.big-btn.loading .b-ico,.chip.loading .c-ico{position:relative}
.big-btn.loading .b-ico::after,.chip.loading .c-ico::after{
  content:"";position:absolute;inset:0;margin:auto;
  width:1rem;height:1rem;
  border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:bspin .7s linear infinite}
@keyframes bspin{to{transform:rotate(360deg)}}

/* Sheet */
.sheet-backdrop{position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,.45);
opacity:0;visibility:hidden;transition:opacity .28s,visibility 0s linear .28s}
.sheet-backdrop.open{opacity:1;visibility:visible;
transition:opacity .28s,visibility 0s linear 0s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11001;
background:var(--bg);border-radius:1.75rem 1.75rem 0 0;
box-shadow:0 -12px 48px rgba(0,0,0,.18);
transform:translateY(100%);display:flex;flex-direction:column;
height:auto;max-height:90dvh;will-change:transform;
transition:transform .35s cubic-bezier(.2,.9,.3,1);
padding-bottom:var(--safe-bottom);overflow:hidden}
.sheet.open{transform:translateY(0)}
.sheet-grip{padding:.75rem 0 .25rem;display:flex;justify-content:center;
flex-shrink:0}
.sheet-grip .bar{width:2.5rem;height:.3125rem;border-radius:999px;
background:var(--divider)}
.sheet-head{padding:.25rem 1.25rem .75rem;flex-shrink:0;
display:flex;align-items:center;justify-content:space-between;gap:.5rem;
border-bottom:1px solid var(--border)}
.sheet-head .s-title{font-size:1.125rem;font-weight:600;color:var(--text)}
.sheet-head .s-close{width:2rem;height:2rem;border-radius:50%;
display:flex;align-items:center;justify-content:center;
color:var(--icon2);transition:background .15s,color .15s}
.sheet-head .s-close:hover{background:var(--primary-tint);color:var(--primary)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
padding:1rem 1.25rem 1rem;-webkit-overflow-scrolling:touch}
.sheet-body::-webkit-scrollbar{width:.25rem}
.sheet-body::-webkit-scrollbar-thumb{background:var(--divider);border-radius:.25rem}
.form-field{margin-bottom:1rem}
.form-field label{display:block;font-size:.75rem;font-weight:600;
color:var(--text2);margin-bottom:.375rem;letter-spacing:.02em}
.form-field input{width:100%;padding:.75rem 1rem;background:var(--bg2);
border-radius:.875rem;font-size:.9375rem;color:var(--text);
border:1.5px solid transparent;transition:border-color .15s,background .15s}
.form-field input:focus{border-color:var(--primary);background:var(--bg)}
.sheet-actions{padding:.75rem 1.25rem 1.25rem;display:flex;gap:.5rem;
border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.sheet-actions button{flex:1;height:3rem;border-radius:1.5rem;
font-size:.9375rem;font-weight:600;transition:background .15s,transform .12s}
.sheet-actions .btn-cancel{background:var(--bg2);color:var(--text)}
.sheet-actions .btn-cancel:hover{background:var(--bg3)}
.sheet-actions .btn-submit{background:var(--primary);color:#fff}
.sheet-actions .btn-submit:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.sheet-actions button.loading{opacity:.7;cursor:wait;pointer-events:none}
.big-btn.loading{opacity:.7;cursor:wait}
.big-btn.loading .b-arrow{opacity:.2}

.sheet-actions button:active{transform:scale(.98)}

.code-sent-banner{
  display:flex;align-items:center;gap:.625rem;
  padding:.75rem .875rem;border-radius:.875rem;
  background:var(--primary-tint);color:var(--primary);
  font-size:.8125rem;font-weight:500;line-height:1.4;
  margin-bottom:1rem}
.code-sent-banner .b-ico{
  width:2rem;height:2rem;border-radius:.625rem;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--primary)}
.code-sent-banner .b-ico .icon{width:1.125rem;height:1.125rem}
.hint-text{font-size:.75rem;color:var(--text2);
margin-top:.375rem;line-height:1.5}

/* Language */
.lang-item{display:flex;align-items:center;gap:.875rem;
padding:.875rem;border-radius:.875rem;cursor:pointer;
transition:background .15s;margin-bottom:.375rem}
.lang-item:hover{background:var(--bg2)}
.lang-item.selected{background:var(--primary-tint)}
.lang-item .flag{width:2.75rem;height:2.75rem;border-radius:.875rem;
display:flex;align-items:center;justify-content:center;
font-size:1.625rem;background:var(--bg2);flex-shrink:0}
.lang-item.selected .flag{background:var(--bg)}
.lang-item .l-name{flex:1;font-size:1rem;font-weight:500;color:var(--text)}
.lang-item .l-code{font-size:.8125rem;color:var(--text2);direction:ltr;
font-family:ui-monospace,monospace}
.lang-item .l-check{width:1.25rem;height:1.25rem;color:var(--primary);
opacity:0;transition:opacity .15s;flex-shrink:0}
.lang-item.selected .l-check{opacity:1}

/* Modal */
.modal-backdrop{position:fixed;inset:0;z-index:12000;background:rgba(0,0,0,.45);
display:flex;align-items:center;justify-content:center;padding:1rem;
opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.modal-backdrop.open{opacity:1;visibility:visible;
transition:opacity .2s,visibility 0s linear 0s}
.modal{width:100%;max-width:22rem;background:var(--bg);border-radius:1.5rem;
box-shadow:0 12px 40px rgba(0,0,0,.25);transform:scale(.94);
transition:transform .25s cubic-bezier(.2,.9,.3,1);overflow:hidden}
.modal-backdrop.open .modal{transform:scale(1)}
.modal-head{padding:1.25rem 1.5rem .5rem;font-size:1.125rem;font-weight:600}
.modal-body{padding:.25rem 1.5rem 1rem;font-size:.9375rem;color:var(--text2);line-height:1.55}
.modal-actions{display:flex;justify-content:flex-end;gap:.25rem;padding:.5rem 1rem 1rem}
.btn-t{height:2.5rem;padding:0 1.25rem;border-radius:1.75rem;
font-size:.9375rem;font-weight:500;color:var(--primary);
display:inline-flex;align-items:center;justify-content:center;
transition:background .15s}
.btn-t:hover{background:var(--primary-tint)}
.btn-t.danger{color:var(--danger)}
.btn-t.danger:hover{background:rgba(229,57,53,.1)}
.btn-t.primary{background:var(--primary);color:#fff}

/* Toast */
.toast-wrap{position:fixed;top:calc(.75rem + var(--safe-top));left:0;right:0;
z-index:20000;display:flex;flex-direction:column;align-items:center;gap:.5rem;
pointer-events:none;padding:0 .75rem}
.toast{display:flex;align-items:center;gap:.625rem;max-width:22rem;
padding:.875rem 1rem;border-radius:1rem;background:#1c1c1eff;color:#fff;
-webkit-backdrop-filter:blur(.5rem);backdrop-filter:blur(.5rem);
font-size:.9375rem;line-height:1.3;animation:toastIn .25s}
.toast.out{opacity:0;transform:translateY(-.5rem);transition:opacity .2s,transform .2s}
@keyframes toastIn{from{opacity:0;transform:translateY(-.75rem)}to{opacity:1;transform:none}}

.loading{display:flex;justify-content:center;align-items:center;
padding:3rem;color:var(--text2)}
.spinner{width:2rem;height:2rem;border:3px solid var(--border);
border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="scroll" id="scroll">
    <div id="content"><div class="loading"><div class="spinner"></div></div></div>
  </div>
  <div class="TopBar" id="top"></div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"><div class="bar"></div></div>
  <div class="sheet-head">
    <div class="s-title" id="sheetTitle"></div>
    <button class="s-close" id="sheetClose">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-actions" id="sheetActions"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
"use strict";
(function(){
  try{ if(localStorage.getItem("rb_theme")==="dark") document.documentElement.classList.add("theme-dark"); }catch(e){}

  var $ = function(s,r){return (r||document).querySelector(s)};
  function h(t,a){var k=Array.prototype.slice.call(arguments,2);var e=document.createElement(t);
    for(var key in (a||{})){var v=a[key];if(v==null||v===false)continue;
      if(key==="class")e.className=v;
      else if(key==="html")e.innerHTML=v;
      else if(key==="style")e.setAttribute("style",v);
      else if(key.indexOf("on")===0&&typeof v==="function")e.addEventListener(key.slice(2),v);
      else e.setAttribute(key,v);}
    k.forEach(function(x){(Array.isArray(x)?x:[x]).forEach(function(y){
      if(y==null||y===false)return;e.append(y.nodeType?y:document.createTextNode(String(y)));});});
    return e;}
  function svgp(p){return '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg></span>'}

  var ICON={
    back:svgp('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>'),
    edit:svgp('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'),

  var PEER=[["#FF845E","#D45246"],["#FEBB5B","#F68136"],["#B694F9","#6C61DF"],
    ["#9AD164","#46BA43"],["#53EDD6","#28C9B7"],["#5CAFFA","#408ACF"],["#FF8AAC","#D95574"]];
  function avatarBg(s){var x=0;for(var i=0;i<(s||"").length;i++)x=(x*31+s.charCodeAt(i))|0;
    var p=PEER[Math.abs(x)%PEER.length];return "linear-gradient(180deg,"+p[0]+" 0%,"+p[1]+" 100%)"}
  function initials(name){if(!name)return "?";var p=String(name).trim().split(/[\s\u200c]+/).filter(Boolean);
    if(!p.length)return "?";return p.length>=2?(Array.from(p[0])[0]||"")+(Array.from(p[1])[0]||""):
      Array.from(p[0]).slice(0,2).join("")}
  function Token(){try{return localStorage.getItem("rb_token")}catch(e){return null}}
  function toast(msg,kind){var t=h("div",{class:"toast"},h("span",null,String(msg)));
    $("#toastWrap").append(t);setTimeout(function(){t.classList.add("out");
      setTimeout(function(){t.remove()},220)},2400)}
  function authHeaders(){var t=Token();return t?{"Authorization":"Bearer "+t}:{}}

  var API={
    get:async function(p){var r=await fetch(p,{credentials:"same-origin",headers:authHeaders()});
      if(r.status===401){location.href="/login";throw new Error("unauth")}
      var j=await r.json().catch(function(){return {}});
      if(!r.ok)throw new Error((j.detail&&typeof j.detail==="string")?j.detail:("HTTP "+r.status));
      return j},
    post:async function(p,b){var hd=Object.assign({"Content-Type":"application/json"},authHeaders());
      var r=await fetch(p,{method:"POST",credentials:"same-origin",headers:hd,body:JSON.stringify(b||{})});
      if(r.status===401){location.href="/login";throw new Error("unauth")}
      var j=await r.json().catch(function(){return {}});
      if(!r.ok)throw new Error((j.detail&&typeof j.detail==="string")?j.detail:("HTTP "+r.status));
      return j},
    del:async function(p){var r=await fetch(p,{method:"DELETE",credentials:"same-origin",headers:authHeaders()});
      if(r.status===401){location.href="/login";throw new Error("unauth")}
      var j=await r.json().catch(function(){return {}});
      if(!r.ok)throw new Error((j.detail&&typeof j.detail==="string")?j.detail:("HTTP "+r.status));
      return j}
  };

  var parts=location.pathname.split("/").filter(Boolean);
  var AID=(parts[0]==="settings"&&parts[1])?decodeURIComponent(parts[1]):
          (new URLSearchParams(location.search).get("aid")||"");
  if(!AID){location.href="/chats";return}

  var accounts=[], current=null, profile={};
  var AVA_BUST=Date.now();
  var galleryState={avatars:[],pos:0,count:0};

  // ═══ Sheet ═══
  var Sheet=(function(){
    var el,bd,titleEl,bodyEl,actionsEl;
    function open(title,body,actions){
      titleEl.textContent=title||"";
      bodyEl.innerHTML="";
      if(typeof body==="string")bodyEl.innerHTML=body;
      else if(body)bodyEl.append(body);
      actionsEl.innerHTML="";
      (actions||[]).forEach(function(a){
        var b=h("button",{class:a.kind==="submit"?"btn-submit":"btn-cancel"},a.label);
        b.onclick=async function(){
          if(b.classList.contains("loading")) return;
          if(!a.onClick) return;
          var orig = b.textContent;
          b.classList.add("loading");
          b.disabled = true;
          if(a.loadingText) b.textContent = a.loadingText;
          try{
            await Promise.resolve(a.onClick());
          }catch(err){
            console.error(err);
          }finally{
            setTimeout(function(){
              if(document.body.contains(b)){
                b.classList.remove("loading");
                b.disabled = false;
                b.textContent = orig;
              }
            }, 100);
          }
        };
        actionsEl.append(b);
      });
      actionsEl.style.display=(actions&&actions.length)?"flex":"none";
      el.style.transition="none";
      el.style.transform="translateY(100%)";
      bd.classList.add("open");
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          el.classList.add("open");
          el.style.transition="transform .35s cubic-bezier(.2,.9,.3,1)";
          el.style.transform="translateY(0)";
        });
      });
    }
    function close(){
      bd.classList.remove("open");
      el.classList.remove("open");
      el.style.transition="transform .3s cubic-bezier(.2,.9,.3,1)";
      el.style.transform="translateY(100%)";
    }
    function init(){
      el=$("#sheet");bd=$("#sheetBackdrop");
      titleEl=$("#sheetTitle");bodyEl=$("#sheetBody");actionsEl=$("#sheetActions");
      $("#sheetClose").onclick=close;
      bd.onclick=close;
      document.addEventListener("keydown",function(e){
        if(e.key==="Escape"&&bd.classList.contains("open"))close();
      });
    }
    return {init:init,open:open,close:close};
  })();

  function openModal(opts){
    var box=$("#modalBox");box.innerHTML="";
    if(opts.title)box.append(h("div",{class:"modal-head"},opts.title));
    var body=h("div",{class:"modal-body"});
    if(typeof opts.content==="string")body.innerHTML=opts.content;
    else if(opts.content)body.append(opts.content);
    box.append(body);
    var actions=opts.actions||[];
    if(actions.length){
      var acts=h("div",{class:"modal-actions"});
      actions.forEach(function(a){
        var b=h("button",{class:"btn-t "+(a.kind||"")},a.label);
        b.onclick=function(){closeModal();if(a.onClick)setTimeout(a.onClick,150)};
        acts.append(b);
      });
      box.append(acts);
    }
    var bd=$("#modalBackdrop");bd.classList.add("open");
    bd.onclick=function(e){if(e.target===bd)closeModal()};
  }
  function closeModal(){$("#modalBackdrop").classList.remove("open")}

  function copyText(txt,label){
    if(!txt)return;
    try{navigator.clipboard.writeText(txt);toast((label||"متن")+" کپی شد","ok")}
    catch(e){
      var ta=document.createElement("textarea");ta.value=txt;document.body.append(ta);
      ta.select();try{document.execCommand("copy")}catch(_){}
      ta.remove();toast((label||"متن")+" کپی شد","ok");
    }
  }

  function makeAvatar(guid,name){
    var av=h("div",{class:"Avatar"});
    var img=document.createElement("img");
    img.loading="lazy";img.alt="";img.referrerPolicy="no-referrer";
    var tries=0;
    function tryLoad(){
      tries++;
      img.src="/api/accounts/"+encodeURIComponent(AID)+"/avatar/"+encodeURIComponent(guid)+
        "?v="+AVA_BUST+"&r="+tries;
    }
    img.onerror=function(){
      if(tries<2){setTimeout(tryLoad,400);return}
      var p=this.parentNode;p.innerHTML="";
      p.style.background=avatarBg(guid);
      p.append(h("span",null,initials(name||guid.slice(0,6))));
    };
    tryLoad();
    av.append(img);
    return av;
  }

  function buildTop(title){
    var bar=$("#top");bar.innerHTML="";
    var back=h("button",{class:"icon-btn",html:ICON.back,title:"بازگشت"});
    back.onclick=function(){location.href="/chats"};
    var moreBtn=h("button",{class:"icon-btn",html:ICON.more,title:"سایر"});
    moreBtn.onclick=function(e){e.stopPropagation();openHeroMenu()};
    bar.append(back,h("div",{class:"title"},title||"تنظیمات"),moreBtn);
    var s=$("#scroll");
    s.addEventListener("scroll",function(){
      bar.classList.toggle("scrolled",s.scrollTop>140);
    },{passive:true});
  }

  // ═══ Gallery ═══
  async function loadGallery(){
    try{
      var r=await API.get("/api/accounts/"+encodeURIComponent(AID)+"/avatars/"+encodeURIComponent(AID));
      galleryState.avatars=r.avatars||[];
      galleryState.count=r.count||0;
      if(!galleryState.count){
        galleryState.avatars=[{
          idx:-1, main:true,
          url:"/api/accounts/"+encodeURIComponent(AID)+"/avatar/"+encodeURIComponent(AID)
        }];
        galleryState.count=1;
      }
      galleryState.pos=0;
    }catch(e){
      galleryState.avatars=[{
        idx:-1, main:true,
        url:"/api/accounts/"+encodeURIComponent(AID)+"/avatar/"+encodeURIComponent(AID)
      }];
      galleryState.count=1;
      galleryState.pos=0;
    }
  }

  function buildGallery(){
    var hero=h("div",{class:"hero"});
    var track=h("div",{class:"gallery-track",id:"galleryTrack"});

    galleryState.avatars.forEach(function(av, i){
      var slide=h("div",{class:"gallery-slide"});
      var shm=h("div",{class:"shm"});
      slide.append(shm);
      var img=document.createElement("img");
      img.alt="";img.referrerPolicy="no-referrer";
      img.decoding="async";
      img.fetchPriority=(i===0)?"high":"low";
      var tries=0;
      function tryLoad(){
        tries++;
        var sep=av.url.indexOf("?")>=0?"&":"?";
        img.src=av.url+sep+"v="+AVA_BUST+"&r="+tries;
      }
      img.onload=function(){img.classList.add("loaded");if(shm.parentNode)shm.remove()};
      img.onerror=function(){
        if(tries<2){setTimeout(tryLoad,400);return}
        img.remove();if(shm.parentNode)shm.remove();
        slide.append(h("div",{class:"fb",style:"background:"+avatarBg(AID)},initials(current.name||"")));
      };
      tryLoad();
      slide.append(img);
      track.append(slide);
    });

    hero.append(track);

    if(galleryState.count>1){
      var bar=h("div",{class:"gallery-progress",id:"galleryProgress"});
      galleryState.avatars.forEach(function(_, i){
        bar.append(h("div",{class:"seg"+(i===0?" on":"")},h("div",{class:"fill"})));
      });
      hero.append(bar);
    }

    hero.append(h("div",{class:"overlay"}));
    hero.append(h("div",{class:"info"},
      h("div",{class:"name"},current.name||"بدون نام"),
      current.phone?h("div",{class:"phone"},current.phone):null));

    if(galleryState.count>1){
      var startX=0,startY=0,deltaX=0,dragging=false,isHoriz=false;
      hero.addEventListener("pointerdown",function(e){
        if(e.target.closest(".hero-actions"))return;
        startX=e.clientX;startY=e.clientY;deltaX=0;
        dragging=true;isHoriz=false;
        track.classList.add("dragging");
      });
      hero.addEventListener("pointermove",function(e){
        if(!dragging)return;
        var dx=e.clientX-startX;
        var dy=e.clientY-startY;
        if(!isHoriz&&Math.abs(dx)>Math.abs(dy)+6)isHoriz=true;
        if(!isHoriz)return;
        deltaX=dx;
        var base=-galleryState.pos*hero.offsetWidth;
        track.style.transform="translateX("+(base+dx)+"px)";
      });
      function endDrag(){
        if(!dragging)return;
        dragging=false;
        track.classList.remove("dragging");
        track.style.transform="";
        if(isHoriz&&Math.abs(deltaX)>hero.offsetWidth*0.2){
          if(deltaX<0)goSlide(galleryState.pos+1);
          else goSlide(galleryState.pos-1);
        }else{
          goSlide(galleryState.pos);
        }
      }
      hero.addEventListener("pointerup",endDrag);
      hero.addEventListener("pointercancel",endDrag);
      hero.addEventListener("pointerleave",endDrag);
    }

    return hero;
  }

  function goSlide(i){
    if(i<0)i=0;
    if(i>=galleryState.count)i=galleryState.count-1;
    galleryState.pos=i;
    var track=$("#galleryTrack");
    if(track){
      track.style.transition="transform .35s cubic-bezier(.2,.9,.3,1)";
      track.style.transform="translateX("+(-i*100)+"%)";
    }
    var segs=document.querySelectorAll("#galleryProgress .seg");
    for(var k=0;k<segs.length;k++){
      segs[k].classList.toggle("on",k<=i);
    }
  }

  function openHeroMenu(){
    var wrap=h("div",{style:"display:flex;flex-direction:column;gap:.75rem"});
    var addItem=h("button",{class:"big-btn"},
      h("div",{class:"b-ico",html:ICON.upload}),

      h("span",{class:"b-arrow",html:ICON.arrow}));
    addItem.onclick=function(){Sheet.close();setTimeout(addPhoto,200)};

    var delItem=h("button",{class:"big-btn danger"},
      h("div",{class:"b-ico",html:ICON.trash}),
      h("div",{class:"b-title"},"حذف این عکس"),
      h("span",{class:"b-arrow",html:ICON.arrow}));
    delItem.onclick=function(){
      Sheet.close();
      setTimeout(function(){
        openModal({title:"حذف عکس پروفایل؟",

  function addPhoto(){
    var inp=$("#photoInput");
    inp.value="";
    inp.onchange=async function(){
      var f=inp.files[0];
      if(!f)return;
      if(f.size>10*1024*1024){toast("حجم بیش از ۱۰ مگابایت","err");return}
      var fd=new FormData();
      fd.append("file",f);
      toast("در حال آپلود...","ok");
      try{
        var r=await fetch("/api/accounts/"+encodeURIComponent(AID)+"/avatar",
          {method:"POST",credentials:"same-origin",headers:authHeaders(),body:fd});
        if(!r.ok){var j=await r.json().catch(function(){return{}});
          throw new Error(j.detail||"خطا")}
        toast("عکس به‌روز شد","ok");
        AVA_BUST=Date.now();
        setTimeout(load,600);
      }catch(e){toast(e.message||"خطا در آپلود","err")}
    };
    inp.click();
  }

  async function deletePhoto(){
    try{
      var cur=galleryState.avatars[galleryState.pos]||{};
      var q=cur.avatar_id?("?avatar_id="+encodeURIComponent(cur.avatar_id)):"";
      await API.del("/api/accounts/"+encodeURIComponent(AID)+"/avatar"+q);
      toast("عکس حذف شد","ok");
      AVA_BUST=Date.now();
      setTimeout(load,500);
    }catch(e){toast(e.message||"خطا","err")}
  }

  function withLoading(btn,fn,loadingText){
    return async function(e){
      if(btn.classList.contains("loading")) return;
      var titleEl = btn.querySelector(".b-title") || btn.querySelector(".c-val") || btn;
      var origText = titleEl.textContent;
      btn.classList.add("loading");
      btn.disabled = true;
      if(loadingText) titleEl.textContent = loadingText;
      try{
        return await fn(e);
      }finally{
        btn.classList.remove("loading");
        btn.disabled = false;
        titleEl.textContent = origText;
      }
    };
  }

  function bigBtn(icon,title,onClick,danger,loadingText){

      h("div",{class:"b-ico",html:icon}),
      h("div",{class:"b-title"},title),
      h("span",{class:"b-arrow",html:ICON.arrow}));
    b.onclick=withLoading(b,onClick,loadingText);
    return b;
  }

    btns.append(bigBtn(ICON.edit,"ویرایش پروفایل",openEditSheet));
    btns.append(bigBtn(ICON.send,"ارسال پیام",
      function(){location.href="/send?aid="+encodeURIComponent(AID)}));
    btns.append(bigBtn(ICON.chart,"آمار ارسال",
      function(){location.href="/reports?aid="+encodeURIComponent(AID)}));
    btns.append(bigBtn(ICON.cog,"تنظیمات ارسال",
      function(){location.href="/settings"}));
    btns.append(bigBtn(ICON.globe,"زبان",openLangSheet));
    btns.append(bigBtn(ICON.logout,"خروج این اکانت",logoutAccount,true));
    btns.append(bigBtn(ICON.power,"خروج از حساب",logoutPanel,true));
    sec.append(btns);
    c.append(sec);
  }

  function field(label,inp){
    var w=h("div",{class:"form-field"});
    w.append(h("label",null,label),inp);
    return w;
  }

  function openEditSheet(){
    var ta=h("input",{placeholder:"نام",value:profile.first_name||current.name||""});
    var tb=h("input",{placeholder:"نام خانوادگی",value:profile.last_name||""});
    var tc=h("input",{placeholder:"نام کاربری (بدون @)",value:(profile.username||"").replace(/^@/,"")});
    var td=h("input",{placeholder:"بیوگرافی",value:profile.bio||""});
    var body=h("div");
    body.append(field("نام",ta),field("نام خانوادگی",tb),
                field("نام کاربری",tc),field("بیوگرافی",td));
    Sheet.open("ویرایش پروفایل",body,[
      {label:"لغو",kind:"cancel",onClick:Sheet.close},
      {label:"ذخیره",kind:"submit",loadingText:"در حال ذخیره...",onClick:async function(){
        var p={};
        if(ta.value.trim())p.first_name=ta.value.trim();
        if(tb.value!==undefined)p.last_name=tb.value.trim();
        if(tc.value.trim())p.username=tc.value.trim();
        if(td.value!==undefined)p.bio=td.value.trim();
        try{
          await API.post("/api/accounts/"+encodeURIComponent(AID)+"/profile",p);
          toast("ذخیره شد","ok");
          Sheet.close();
          setTimeout(load,300);
        }catch(e){toast(e.message||"خطا","err")}
      }}
    ]);
    setTimeout(function(){try{ta.focus()}catch(e){}},200);
  }

  // ═══ Language ═══
  var LANG_KEY="rb_lang";
  function getLang(){try{return localStorage.getItem(LANG_KEY)||"fa"}catch(e){return "fa"}}
  function setLang(v){try{localStorage.setItem(LANG_KEY,v)}catch(e){}}
  function openLangSheet(){
    var cur=getLang();
    var wrap=h("div");
    var langs=[
      {code:"fa",name:"فارسی",flag:"🇮🇷",dir:"rtl"},
      {code:"en",name:"English",flag:"🇺🇸",dir:"ltr"}
    ];
    langs.forEach(function(l){
      var item=h("div",{class:"lang-item"+(l.code===cur?" selected":"")},
        h("div",{class:"flag"},l.flag),
        h("div",{class:"l-name"},l.name),
        h("div",{class:"l-code"},l.code.toUpperCase()),
        h("span",{class:"l-check",html:ICON.check}));
      item.onclick=function(){
        setLang(l.code);
        document.documentElement.dir=l.dir;
        document.documentElement.lang=l.code;
        var items=wrap.querySelectorAll(".lang-item");
        for(var i=0;i<items.length;i++)items[i].classList.remove("selected");
        item.classList.add("selected");
        toast("زبان تغییر کرد","ok");
      };
      wrap.append(item);
    });
    Sheet.open("انتخاب زبان",wrap,[]);
  }

  // ═══ Add Account ═══
  function statusToWhere(st){
    st=String(st||"").toLowerCase();
    if(st.indexOf("sms")>=0)return "پیامک";
    if(st.indexOf("push")>=0||st.indexOf("app")>=0||st.indexOf("inapp")>=0)
      return "داخل اپلیکیشن روبیکا";
    if(st.indexOf("call")>=0||st.indexOf("voice")>=0)return "تماس تلفنی";
    if(st.indexOf("passkey")>=0||st.indexOf("pass_key")>=0)
      return "اپلیکیشن (نیاز به رمز دوم)";
    return "پیامک یا اپلیکیشن روبیکا";
  }

  function openAddAccountSheet(){
    var phoneInp=h("input",{
      placeholder:"989121234567",type:"tel",dir:"ltr",
      inputmode:"numeric",autocomplete:"tel"});
    phoneInp.style.fontFamily="ui-monospace,Menlo,monospace";
    phoneInp.style.letterSpacing=".02em";

    var body=h("div");
    body.append(field("شماره موبایل (با کد کشور)",phoneInp));
    body.append(h("div",{class:"hint-text"},
      "مثال: 989121234567 — بدون صفر ابتدایی، با کد کشور"));

    Sheet.open("افزودن اکانت",body,[
      {label:"انصراف",kind:"cancel",onClick:function(){Sheet.close()}},
      {label:"ارسال کد",kind:"submit",loadingText:"در حال ارسال کد...",onClick:async function(){
        await doAddSendCode(phoneInp.value);
      }}
    ]);
    setTimeout(function(){try{phoneInp.focus()}catch(e){}},200);
  }

  async function doAddSendCode(rawPhone){
    var phone=String(rawPhone||"").replace(/[^\d+]/g,"").replace(/^\+/,"");
    if(phone.startsWith("0"))phone="98"+phone.slice(1);
    if(phone.length<10){toast("شماره نامعتبر","err");return}

    try{
      var r=await API.post("/api/accounts/add",{phone:phone});
      if(r.need_passkey){
        openPasskeySheet(phone,r.hint||"");
      }else{
        openCodeSheet(phone,r.status||"");
      }
    }catch(e){
      toast(e.message||"خطا در ارسال کد","err");
    }
  }

  function openPasskeySheet(phone,hint){
    var pkInp=h("input",{placeholder:"رمز دوم",type:"password",dir:"ltr"});
    var body=h("div");
    body.append(h("div",{class:"code-sent-banner"},
      h("div",{class:"b-ico",html:ICON.lock}),
      h("div",null,"این اکانت رمز دوم (2FA) دارد. لطفاً رمز را وارد کنید.")));
    body.append(field("رمز دوم",pkInp));
    if(hint)body.append(h("div",{class:"hint-text"},"راهنما: "+hint));

    Sheet.open("رمز دوم",body,[
      {label:"انصراف",kind:"cancel",onClick:function(){Sheet.close()}},
      {label:"تایید",kind:"submit",onClick:async function(){
        var pk=pkInp.value.trim();
        if(!pk){toast("رمز را وارد کن","err");return}
        try{
          await API.post("/api/accounts/verify",{pass_key:pk});
          toast("رمز قبول شد","ok");
          openCodeSheet(phone,"SendCode");
        }catch(e){
          toast(e.message||"رمز اشتباه","err");
        }
      }}
    ]);
    setTimeout(function(){try{pkInp.focus()}catch(e){}},200);
  }

  function openCodeSheet(phone,status){
    var codeInp=h("input",{
      placeholder:"12345",type:"tel",dir:"ltr",
      inputmode:"numeric",autocomplete:"one-time-code",maxlength:"8"});
    codeInp.style.fontFamily="ui-monospace,Menlo,monospace";
    codeInp.style.letterSpacing=".15em";
    codeInp.style.textAlign="center";
    codeInp.style.fontSize="1.125rem";

    var where=statusToWhere(status);
    var body=h("div");
    body.append(h("div",{class:"code-sent-banner"},
      h("div",{class:"b-ico",html:ICON.send}),
      h("div",null,"کد تایید به "+where+" ارسال شد")));
    body.append(field("کد تایید",codeInp));
    body.append(h("div",{class:"hint-text"},"کد را از "+where+" بگیر و اینجا وارد کن"));

    Sheet.open("تایید شماره",body,[
      {label:"ارسال مجدد",kind:"cancel",loadingText:"در حال ارسال...",onClick:async function(){await resendCode(phone)}},
      {label:"تایید",kind:"submit",loadingText:"در حال ثبت...",onClick:async function(){await verifyCode(codeInp.value)}}
    ]);
    setTimeout(function(){try{codeInp.focus()}catch(e){}},200);
  }

  async function resendCode(phone){
    try{
      var r=await API.post("/api/accounts/add",{phone:phone});
      if(r.need_passkey){
        toast("رمز دوم لازم است","err");
        openPasskeySheet(phone,r.hint||"");
      }else{
        toast("کد دوباره به "+statusToWhere(r.status)+" ارسال شد","ok");
      }
    }catch(e){toast(e.message||"خطا در ارسال مجدد","err")}
  }

  async function verifyCode(rawCode){
    var code=String(rawCode||"").trim();
    if(!code){toast("کد را وارد کن","err");return}
    try{
      var r=await API.post("/api/accounts/verify",{code:code});
      if(r.ok){
        toast("اکانت اضافه شد","ok");
        Sheet.close();
        setTimeout(function(){location.reload()},700);
      }else{
        toast("کد اشتباه","err");
      }
    }catch(e){toast(e.message||"کد اشتباه","err")}
  }

  // ═══ Logout ═══
  function logoutAccount(){
    openModal({title:"خروج این اکانت؟",
      content:"اکانت "+((current&&current.name)||AID)+" از پنل حذف می‌شود.",
      actions:[{label:"لغو"},{label:"خروج",kind:"danger",onClick:async function(){
        try{await API.del("/api/accounts/"+encodeURIComponent(AID));
          toast("اکانت حذف شد","ok");
          setTimeout(function(){location.href="/accounts"},500);
        }catch(e){toast(e.message||"خطا","err")}
      }}]});
  }
  function logoutPanel(){
    openModal({title:"خروج از حساب؟",content:"از پنل وب خارج می‌شوی.",
      actions:[{label:"لغو"},{label:"خروج",kind:"danger",onClick:async function(){
        try{await API.post("/api/auth/logout");location.href="/login"}
        catch(e){toast(e.message||"خطا","err")}
      }}]});
  }

  function showSkeleton(){
    var c=$("#content");c.innerHTML="";
    c.append(h("div",{class:"sk sk-hero"}));
    var chips=h("div",{class:"sk-chips"},
      h("div",{class:"sk sk-chip"}),
      h("div",{class:"sk sk-chip"}),
      h("div",{class:"sk sk-chip"}));
    c.append(chips);
    [1,2].forEach(function(i){
      var s=h("div",{class:"sk-sec"},
        h("div",{class:"sk sk-t"}),
        h("div",{class:"sk sk-btn"}),
        h("div",{class:"sk sk-btn"}));
      c.append(s);
    });
  }

  async function load(){
    showSkeleton();
    try{
      var r=await API.get("/api/accounts");
      accounts=r.accounts||[];
      current=accounts.find(function(a){return String(a.id)===String(AID)})||null;
      if(!current){location.href="/accounts";return}
      try{profile=await API.get("/api/accounts/"+encodeURIComponent(AID)+"/profile")}
      catch(e){profile={}}
      if(!current.user_guid&&profile.user_guid)current.user_guid=profile.user_guid;
      document.title="تنظیمات — "+(current.name||"اکانت");
      buildTop(current.name||"تنظیمات");
      await loadGallery();
      render();
      var content=$("#content");
      if(content){
        var g=buildGallery();
        content.insertBefore(g,content.firstChild);
      }
      try{
        fetch("/api/accounts/"+encodeURIComponent(AID)+"/avatars/"+encodeURIComponent(AID)+"/prefetch",
          {method:"POST",credentials:"same-origin",headers:authHeaders()});
      }catch(_){}
    }catch(e){
      var c=$("#content");
      if(c)c.innerHTML='<div class="loading">'+String(e.message||e)+'</div>';
    }
  }

  Sheet.init();
  load();
})();
</script>
</body>
</html>
